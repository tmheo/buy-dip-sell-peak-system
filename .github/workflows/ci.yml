# PR 테스트 CI (#66)
#
# PostgreSQL 서비스 컨테이너에 drizzle-kit push로 스키마를 만들고
# DATABASE_URL을 주입해 DB 통합 테스트까지 실행한다.
#
# 알려진 한계:
# - 백테스트 골든 값 검증(runBacktestWithParams 계열)은 실제 SOXL 시세가
#   필요한데 CI DB는 비어 있으므로 건너뛴다. CI에 가격 데이터를 채워 넣어
#   이 검증을 살리는 것은 별도 이슈로 다룬다.
# - RLS 마이그레이션(enable_rls_all_tables)은 Supabase 전용 auth.uid()를
#   사용하므로 vanilla PostgreSQL에는 적용하지 않는다. 테스트는 슈퍼유저로
#   접속해 RLS를 우회하므로 결과에 영향이 없다.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 린트
        run: npm run lint

      - name: 포맷 검사
        run: npm run format:check

      - name: DB 스키마 생성 (drizzle-kit push)
        run: npx drizzle-kit push --force

      - name: supabase 증분 마이그레이션 적용
        # 스키마 소스는 drizzle 스키마이므로 증분 마이그레이션은 사실상
        # 멱등(IF NOT EXISTS) 재적용이다. CI에서도 돌려 vanilla PostgreSQL에서
        # 실행 가능함을 계속 검증한다. RLS 마이그레이션 제외 사유는 파일
        # 상단 주석 참고.
        run: |
          for f in supabase/migrations/*.sql; do
            if [[ "$f" == *enable_rls_all_tables* ]]; then
              echo "skip $f (Supabase 전용 auth.uid() 사용)"
              continue
            fi
            echo "apply $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: 테스트 (DB 통합 테스트 포함)
        run: npm test
